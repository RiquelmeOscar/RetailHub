services:
  postgres:
    image: postgres:16-alpine
    container_name: retailhub-postgres
    environment:
      POSTGRES_USER: retailhub
      POSTGRES_PASSWORD: retailhub
      POSTGRES_DB: retailhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
